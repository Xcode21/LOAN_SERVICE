server:
  port: 8098
spring:
  application:
    name: "LoanService"
  devtools:
    add-properties: false
  profiles:
    include: null
  sql:
    init:
      mode: "always"
      schema-locations: "classpath:db/migration/V1__create_solicitud_table.sql"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
  r2dbc:
    host: "localhost"
    port: 5432
    database: "applicationdb"
    schema: "public"
    username: "app"
    password: "secret"
